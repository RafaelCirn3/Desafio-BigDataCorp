<svg xmlns="http://www.w3.org/2000/svg" width="1470" height="860" viewBox="0 0 1470 860" role="img" aria-label="Diagrama de arquitetura da plataforma de venda de ingressos"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#2468b8"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#173357}.heading{font-size:32px;font-weight:700}.subtitle{font-size:17px;fill:#47617d}.boxhead{font-size:17px;font-weight:700}.line{font-size:14px}.footer{font-size:14px;fill:#63748a}</style><rect width="1470" height="860" fill="#fafcff"/><text x="30" y="54" class="heading">Arquitetura — Plataforma de Venda de Ingressos</text><text x="30" y="86" class="subtitle">Alta demanda · Sorteio inicial + FIFO · Estoque transacional · Pagamentos assíncronos</text><path d="M30 105 H1440" stroke="#d6e3f1" stroke-width="2"/><g><rect x="30" y="145" width="210" height="130" rx="13" fill="#e8f3ff" stroke="#b7c9dd" stroke-width="1.5"/><text x="48" y="175" class="boxhead">01  COMPRADORES</text><text x="48" y="203" class="line">Web / Mobile</text><text x="48" y="225" class="line">Milhões de acessos</text><text x="48" y="247" class="line">Tokens de sessão</text></g><g><rect x="270" y="145" width="240" height="130" rx="13" fill="#eee8ff" stroke="#b7c9dd" stroke-width="1.5"/><text x="288" y="175" class="boxhead">02  BORDA</text><text x="288" y="203" class="line">CDN + WAF</text><text x="288" y="225" class="line">Rate limiting</text><text x="288" y="247" class="line">Load Balancer</text></g><g><rect x="540" y="145" width="310" height="130" rx="13" fill="#e5f0ff" stroke="#b7c9dd" stroke-width="1.5"/><text x="558" y="175" class="boxhead">03  ASP.NET CORE</text><text x="558" y="203" class="line">APIs stateless (N instâncias)</text><text x="558" y="225" class="line">Fila / Catálogo / Pagamento</text><text x="558" y="247" class="line">Autenticação e autorização</text></g><g><rect x="880" y="145" width="260" height="130" rx="13" fill="#e6f7ed" stroke="#b7c9dd" stroke-width="1.5"/><text x="898" y="175" class="boxhead">04  REDIS</text><text x="898" y="203" class="line">Sorted Sets: sorteio + FIFO</text><text x="898" y="225" class="line">Admissão controlada</text><text x="898" y="247" class="line">Streams e rate limiting</text></g><g><rect x="1170" y="145" width="270" height="130" rx="13" fill="#e6f7ed" stroke="#b7c9dd" stroke-width="1.5"/><text x="1188" y="175" class="boxhead">05  POSTGRESQL</text><text x="1188" y="203" class="line">Estoque transacional</text><text x="1188" y="225" class="line">Reservas por 15 minutos</text><text x="1188" y="247" class="line">Vendas e eventos duráveis</text></g><g><rect x="540" y="385" width="310" height="140" rx="13" fill="#fff1e5" stroke="#b7c9dd" stroke-width="1.5"/><text x="558" y="415" class="boxhead">06  PAGAMENTO</text><text x="558" y="443" class="line">Reserva ao iniciar checkout</text><text x="558" y="465" class="line">Gateway externo substituível</text><text x="558" y="487" class="line">Asaas: EXEMPLO PRÁTICO</text></g><g><rect x="880" y="385" width="260" height="140" rx="13" fill="#fff1e5" stroke="#b7c9dd" stroke-width="1.5"/><text x="898" y="415" class="boxhead">07  WEBHOOKS</text><text x="898" y="443" class="line">Validação de autenticidade</text><text x="898" y="465" class="line">Persistência antes do 200</text><text x="898" y="487" class="line">Idempotência</text></g><g><rect x="1170" y="385" width="270" height="140" rx="13" fill="#fff1e5" stroke="#b7c9dd" stroke-width="1.5"/><text x="1188" y="415" class="boxhead">08  WORKERS .NET</text><text x="1188" y="443" class="line">Redis Streams + reprocessamento</text><text x="1188" y="465" class="line">Expiração e conciliação</text><text x="1188" y="487" class="line">Circuit breaker + backoff</text></g><g><rect x="30" y="385" width="480" height="140" rx="13" fill="#eef4ff" stroke="#b7c9dd" stroke-width="1.5"/><text x="48" y="415" class="boxhead">JUSTIÇA E CONTROLE</text><text x="48" y="443" class="line">Sorteio inicial entre participantes elegíveis</text><text x="48" y="465" class="line">FIFO e entradas tardias no fim da fila</text><text x="48" y="487" class="line">Acesso não equivale a reserva</text></g><g><rect x="30" y="640" width="445" height="170" rx="13" fill="#e7f7f2" stroke="#b7c9dd" stroke-width="1.5"/><text x="48" y="670" class="boxhead">ESCALABILIDADE</text><text x="48" y="698" class="line">CDN / WAF e balanceamento de carga</text><text x="48" y="720" class="line">Instâncias ASP.NET Core horizontais</text><text x="48" y="742" class="line">Rate limiting por rota e usuário</text><text x="48" y="764" class="line">Admissão conforme capacidade do checkout</text></g><g><rect x="495" y="640" width="445" height="170" rx="13" fill="#f0edff" stroke="#b7c9dd" stroke-width="1.5"/><text x="513" y="670" class="boxhead">CONSISTÊNCIA E RECUPERAÇÃO</text><text x="513" y="698" class="line">Reserva atômica no PostgreSQL</text><text x="513" y="720" class="line">Fila reconstruível a partir de estado durável</text><text x="513" y="742" class="line">Eventos financeiros persistidos e idempotentes</text><text x="513" y="764" class="line">Sem overselling mesmo com concorrência</text></g><g><rect x="960" y="640" width="480" height="170" rx="13" fill="#fff0ed" stroke="#b7c9dd" stroke-width="1.5"/><text x="978" y="670" class="boxhead">FALHAS DO GATEWAY</text><text x="978" y="698" class="line">Timeout: consultar antes de cobrar novamente</text><text x="978" y="720" class="line">Webhook atrasado: conciliar estado</text><text x="978" y="742" class="line">Reserva vencida: liberação somente após verificação</text><text x="978" y="764" class="line">Asaas é ilustrativo, não obrigatório</text></g><path d="M240 210 L270 210" stroke="#2468b8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M510 210 L540 210" stroke="#2468b8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M850 210 L880 210" stroke="#2468b8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1140 210 L1170 210" stroke="#2468b8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M695 275 L695 385" stroke="#2468b8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1010 275 L1010 385" stroke="#2468b8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1305 275 L1305 385" stroke="#2468b8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M850 455 L880 455" stroke="#2468b8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1140 455 L1170 455" stroke="#2468b8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="30" y="850" class="footer">Diagrama conceitual · C# / ASP.NET Core · Redis · PostgreSQL · Gateway substituível (Asaas como exemplo)</text></svg>